name = "thinkinfosec-signal-cron"
main = "index.js"
compatibility_date = "2026-11-06"
workers_dev = false

# GitHub's own schedule is best-effort and often skipped; this fires on time.
[triggers]
crons = ["*/15 * * * *"]

# Secret (not in git): GH_TOKEN, a fine-grained PAT scoped to ThinkInfoSec/Signal with Actions: read and write only.
